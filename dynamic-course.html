<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <style>
        .hub-container { max-width: 800px; margin: 50px auto; padding: 20px; text-align: center; }
        .hub-buttons { margin: 30px 0; }
        .hub-btn { display: inline-block; margin: 10px; padding: 15px 30px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .hub-btn:hover { background: #0056b3; }
        .content-section { text-align: left; margin-top: 30px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 6px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<header>
    <nav class="nav-left">
        <ul>
            <li class="dropdown">
                <a href="#" class="dropbtn">Courses ▾</a>
                <ul class="dropdown-content" id="course-list">
                    <li><a href="index.html">Mobile Crane</a></li>
                </ul>
            </li>
        </ul>
    </nav>
    <nav class="nav-right">
        <ul>
            <li class="dropdown">
                <a href="#" class="dropbtn">Menu ▾</a>
                <ul class="dropdown-content">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="newhtml.html">Add New Content</a></li>
                </ul>
            </li>
        </ul>
    </nav>
</header>

<main class="hub-container">
    <h1 id="course-title">Loading Course...</h1>

    <div id="course-custom-html" class="content-section"></div>

    <div class="hub-buttons">
        <button class="hub-btn" onclick="openSection('quiz')">Practice Test</button>
        <button class="hub-btn" onclick="openSection('reading')">Study Material</button>
    </div>

    <section id="grade"></section>

    <div id="quiz-view" class="content-section hidden">
        <h2>Practice Test</h2>
        <div id="quiz-question-box"></div>
        <div id="quiz-options-box"></div>
        <p id="quiz-feedback" style="font-weight: bold; margin-top: 15px;"></p>
        <button id="next-quiz-btn" class="hub-btn hidden" onclick="nextQuizQuestion()" style="padding: 8px 15px; font-size: 0.9em;">Next Question</button>
    </div>

    <div id="reading-view" class="content-section hidden">
        <h2>Study Material</h2>
        <div id="reading-page-box"></div>
        <div style="margin-top: 15px;">
            <button class="hub-btn" id="prev-page-btn" onclick="changeReadingPage(-1)" style="padding: 8px 15px; font-size: 0.9em;">Previous Page</button>
            <span id="reading-page-indicator" style="margin: 0 15px;"></span>
            <button class="hub-btn" id="next-page-btn" onclick="changeReadingPage(1)" style="padding: 8px 15px; font-size: 0.9em;">Next Page</button>
        </div>
    </div>
</main>
    

<script type="module" src="dynamic-course.js"></script>
</body>
</html>
